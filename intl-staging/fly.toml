# fly.toml for rfb-intl-staging — the SE/DK candidate base.
# A SEPARATE Fly app from the main `lokal` app (DPIA T17: the candidate base
# lies outside prod). Nothing here is public: every route but /health needs the
# bearer token. Deploy (from the repo root):
#   fly deploy --config intl-staging/fly.toml --dockerfile intl-staging/Dockerfile intl-staging
# See intl-staging/README.md for first-time setup (app, volume, secrets).

app = 'rfb-intl-staging'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  DATA_DIR = '/data'
  DISK_MAX_PCT = '80'
  DB_MAX_MB = '2048'

[[mounts]]
  source = 'intl_data'
  destination = '/data'
  initial_size = '3gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
  cpus = 1
  memory_mb = 1024

# Type-check + tests for the standalone SE/DK staging service (intl-staging/).
# It is a separate Fly app with its own package.json, so the root CI job does not
# cover it. Deploy is manual (see intl-staging/README.md) — nothing here deploys.
name: intl-staging CI

on:
  pull_request:
    paths:
      - "intl-staging/**"
      - ".github/workflows/intl-staging-ci.yml"
  push:
    branches:
      - main
    paths:
      - "intl-staging/**"

jobs:
  test:
    name: intl-staging type-check + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intl-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

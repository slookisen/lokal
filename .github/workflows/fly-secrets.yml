# Sync one or more secrets from GitHub Actions secrets → Fly.io app secrets.
#
# Why this exists: local `fly` / `flyctl` is blocked by Windows Application
# Control policy on Daniel's machine (same reason fly-deploy.yml exists), so a
# Fly secret such as FIRE_ROUTINES or RETENTION_JOB_ENABLED could only be set
# from the Fly web dashboard — which cannot READ existing values, making a
# JSON-map secret like FIRE_ROUTINES awkward to extend. The GitHub-hosted
# runner has no such restriction and already holds FLY_API_TOKEN.
#
# How to use (Actions tab → "Fly Secrets Sync" → Run workflow):
#   1. Repo → Settings → Secrets and variables → Actions → New repository secret,
#      with the SAME NAME the Fly app expects (e.g. FIRE_ROUTINES) and the full
#      value (for FIRE_ROUTINES: the complete one-line JSON map).
#   2. Run this workflow with `names` = JSON array of those names,
#      e.g. ["FIRE_ROUTINES"] or ["FIRE_ROUTINES","RETENTION_JOB_ENABLED"].
#      To replace ONE routine's /fire token without rebuilding the FIRE_ROUTINES
#      JSON: generate a new API token on that routine (claude.ai/code/routines),
#      store it as FIRE_ROUTINE_<AGENT>_TOKEN (e.g. FIRE_ROUTINE_EXPERIENCES_ENRICHMENT_TOKEN)
#      and run with ["FIRE_ROUTINE_EXPERIENCES_ENRICHMENT_TOKEN"]. The verify step
#      prints override_keys / override_ignored from /admin/loop-dispatch.
#   3. Each name is copied 1:1 to the Fly app. Fly restarts the app once per
#      import (names are processed one at a time, max-parallel 1).
#
# Safety: values are never echoed (only the name and character count). Every
# value is checked by scripts/validate-fly-secret-value.py BEFORE anything is
# written — missing/empty, multi-line, unparseable JSON, an unsubstituted
# placeholder, or a credential field too short to be real all fail the run with
# nothing sent to Fly; a redundant `NAME=` prefix is stripped with a warning.
# Removing a Fly secret is deliberately NOT supported here — do that in the Fly
# dashboard so it stays an explicit human action.

name: Fly Secrets Sync

on:
  workflow_dispatch:
    inputs:
      names:
        description: 'JSON array of secret names to copy from GitHub secrets to Fly (same name on both sides)'
        required: true
        default: '["FIRE_ROUTINES"]'
      app:
        description: 'Fly app name'
        required: true
        default: 'lokal'

jobs:
  sync:
    name: Set ${{ matrix.name }} on Fly
    runs-on: ubuntu-latest
    concurrency:
      group: fly-secrets-${{ inputs.app }}
      cancel-in-progress: false
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        name: ${{ fromJSON(inputs.names) }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ inputs.app }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate ${{ matrix.name }} before writing anything
        # scripts/validate-fly-secret-value.py is the single place that decides
        # what reaches Fly: it rejects an empty/multi-line value, an unsubstituted
        # placeholder ("token":"TOKEN"), a credential field too short to be real,
        # and JSON that does not parse; it strips a redundant "NAME=" prefix; and
        # it writes the exact NAME=VALUE line the next step imports, so what was
        # checked is byte-for-byte what gets written. Both rejections it exists
        # for happened for real on 2026-09-03 — see the script's docstring.
        env:
          SECRET_NAME: ${{ matrix.name }}
          # Dynamic lookup: the GitHub secret with exactly this name.
          SECRET_VALUE: ${{ secrets[matrix.name] }}
          SECRET_LINE_OUT: ${{ runner.temp }}/fly-secret.env
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::FLY_API_TOKEN is not set as a GitHub secret"; exit 1
          fi
          python3 scripts/validate-fly-secret-value.py

      - name: Import ${{ matrix.name }}
        env:
          SECRET_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          # Value goes in on stdin, never via argv (argv is visible in process
          # listings), and is removed again whether or not the import succeeds.
          trap 'rm -f "${RUNNER_TEMP}/fly-secret.env"' EXIT
          flyctl secrets import -a "${FLY_APP}" < "${RUNNER_TEMP}/fly-secret.env"
          echo "Set ${SECRET_NAME} on Fly app ${FLY_APP}"

      - name: Confirm the secret is present on Fly (names only)
        env:
          SECRET_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          # Match the NAME as a whole word anywhere on the line, not anchored to
          # column 0: flyctl 0.4.x renders `secrets list` as a box-drawn table, so
          # every row starts with "| " and a line-anchored grep never matches — it
          # reported "not found" on run 1 (2026-09-03) even though the import in
          # the step above had just succeeded and the app had already restarted
          # with the new value. `-w` still rejects a substring hit (FIRE_ROUTINES
          # does not match inside MY_FIRE_ROUTINES: `_` is a word character).
          flyctl secrets list -a "${FLY_APP}" | grep -qw "${SECRET_NAME}" \
            || { echo "::error::${SECRET_NAME} not found in 'flyctl secrets list' after import"; exit 1; }
          echo "${SECRET_NAME} is present on Fly app ${FLY_APP}"

      - name: Verify FIRE_ROUTINES mapping via /admin/loop-dispatch (names only)
        # Only for FIRE_ROUTINES and the per-routine FIRE_ROUTINE_<AGENT>_TOKEN/_TRIG
        # overrides, and only when ADMIN_KEY is available as a GitHub secret. The
        # endpoint's diag (`fire_routines`) never returns trig/token values — just the
        # agent names that mapped, which overrides applied, and override variable
        # NAMES that were set but ignored (misspelt agent, nothing to pair with).
        if: ${{ (matrix.name == 'FIRE_ROUTINES' || startsWith(matrix.name, 'FIRE_ROUTINE_')) && env.ADMIN_KEY != '' }}
        run: |
          set -euo pipefail
          echo "Waiting for the app to restart with the new secret..."
          for i in $(seq 1 12); do
            sleep 10
            if curl -sf -o /dev/null --max-time 10 https://rettfrabonden.com/healthz; then break; fi
          done
          curl -sS --max-time 20 -H "X-Admin-Key: ${ADMIN_KEY}" https://rettfrabonden.com/admin/loop-dispatch \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); f=d.get("fire_routines") or {}; print("routines mapped:", d.get("routines")); print("parse_ok:", f.get("parse_ok"), "parse_error:", f.get("parse_error")); print("override_keys:", f.get("override_keys")); print("override_ignored:", f.get("override_ignored"))'

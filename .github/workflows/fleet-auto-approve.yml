name: Fleet auto-approve

# Auto-approves + auto-merges fleet-generated PRs (author = a trusted fleet
# identity: slookisen or claude[bot]) once an
# independent fleet code-reviewer has posted an APPROVED verdict comment AND all
# required status checks are green. Approves as `github-actions[bot]` — an identity
# distinct from the PR author, so branch protection's "distinct approver" rule is
# satisfied by GitHub itself (Proposer != admitter stays platform-enforced, not
# honor-system). See dev-requests/2026-07-02-github-actions-auto-approver.md.
#
# Deliberately uses `pull_request` / `issue_comment` / `check_suite` (NOT
# `pull_request_target`) — every PR this workflow acts on is same-repo
# (fleet branches, never a fork), so there is no reduced-permission-token
# reason to reach for the riskier `_target` event, and staying on the
# non-`_target` events avoids ever running workflow code with base-repo
# secrets against untrusted fork input.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  check_suite:
    types: [completed]

permissions:
  pull-requests: write
  contents: read
  checks: read
  statuses: read

jobs:
  resolve-pr:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Resolve PR number for this event
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber = null;
            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
            } else if (context.eventName === 'issue_comment' && context.payload.issue.pull_request) {
              prNumber = context.payload.issue.number;
            } else if (context.eventName === 'check_suite') {
              const prs = context.payload.check_suite.pull_requests || [];
              if (prs.length > 0) prNumber = prs[0].number;
            }
            core.setOutput('pr_number', prNumber ?? '');

  evaluate:
    needs: resolve-pr
    if: needs.resolve-pr.outputs.pr_number != ''
    runs-on: ubuntu-latest
    concurrency:
      group: fleet-auto-approve-pr-${{ needs.resolve-pr.outputs.pr_number }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
      contents: write
      checks: read
      statuses: read
      actions: write
    steps:
      - name: Gate + approve + enable auto-merge
        id: gate
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
          A2A_READ_PAT: ${{ secrets.A2A_READ_PAT }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const { owner, repo } = context.repo;

            const note = (msg) => github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body: `**fleet-auto-approve:** ${msg}`,
            });

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });

            // 1. PR author must be a trusted fleet identity. `claude[bot]` is the
            //    GitHub-App identity Daniel's own Claude sessions/Cloud Routines write
            //    through — only this account's installation can author as it, so it is
            //    exactly as trusted as the PAT identity `slookisen`. (Option A,
            //    Daniel-approved 2026-07-07 — see slookisen/A2A
            //    supervisor-inbox/2026-07-06-priority-headsup-fleet-auto-approve-identity-broken.md)
            const FLEET_IDENTITIES = ['slookisen', 'claude[bot]'];
            if (!FLEET_IDENTITIES.includes(pr.user.login)) {
              core.info(`author=${pr.user.login} not in [${FLEET_IDENTITIES.join(', ')}] — not a fleet PR, no-op`);
              return;
            }

            // 1.5. needs_daniel is a HARD STOP, independent of everything below —
            //      dev-request 2026-08-16-fleet-auto-approve-protected-innholdsbasert-
            //      deteksjon, Slice B. Root cause of 3 documented gate-integrity misses
            //      (lokal#455, #499, #583 — all supervisor-flags/-reports incidents):
            //      an independent reviewer had ALREADY judged a PR needs Daniel (in the
            //      review-verdict doc, or the PR body/label) and this gate approved it
            //      anyway, because that judgment was never actually read here. No
            //      content-regex below can be complete enough to substitute for an
            //      explicit human call a reviewer already made — so this check runs
            //      FIRST and is checked from every place the fleet actually records the
            //      flag: PR body/labels now, the review-verdict doc once fetched in
            //      step 4 below (search for needsDanielRe again there).
            const needsDanielRe = /needs[_-]?daniel/i;
            // Prose mentions of "needs_daniel" (PR body, review doc below) need
            // negation-awareness — a bare substring test trips exactly as hard on a
            // NEGATED mention ("not a protected path, no needs_daniel flag required")
            // as on a real escalation. Recurred 3x (2026-08-24/26/27,
            // dev-requests/2026-08-27-fleet-auto-approve-needs-daniel-substring-bug.md)
            // — same defect class §4 below already fixed for VERDICT:-anchoring
            // (lokal#171/#208), never applied here. Labels are exact short tags, not
            // prose, so the label check below is intentionally left on the plain
            // substring test — hasGenuineNeedsDanielFlag is for free-form text only.
            //
            // For every occurrence of the term, find the nearest clause boundary
            // BEFORE it and require that no negation word
            // (no/not/never/without/ingen/uten/aldri/ikke) appears between that
            // boundary and the term. A single un-negated occurrence anywhere in the
            // text still trips the flag — fail closed toward escalation, same
            // direction as before — this only silences occurrences that are
            // themselves explicitly negated; it never requires reviewers to adopt a
            // new required syntax they don't already use.
            //
            // Two independent review rounds widened the boundary definition beyond
            // a naive ./!/?/newline/comma set:
            //  - punctuation/dash tokens, including the literal ASCII "--" (a far
            //    more common em-dash substitute in raw plain-text/markdown than the
            //    real — character) alongside —/–/./!/ ?/,/;/: and an open paren "("
            //    (a parenthetical aside is its own clause);
            //  - conjunction WORDS that signal a clause transition even with NO
            //    punctuation before them at all (but/however/although/though/yet,
            //    plus Norwegian men/likevel) — added after round-2 review found
            //    "Not a protected path but needs_daniel given the scope" (zero
            //    punctuation before "but") still let the earlier "Not" leak across
            //    into a genuine escalation clause.
            // Known residual gap (documented, not solved): two clauses fused with
            // NEITHER punctuation NOR one of these conjunction words (a true
            // run-on) can still leak a negation across. Judged an acceptable
            // residual for a dependency-free textual heuristic running inline in a
            // github-script step with no checkout — a fully general fix needs real
            // sentence parsing. This does not weaken the fail-closed direction for
            // any of the historical incidents or the recurring bug this check
            // exists to catch; it narrows an already-narrow theoretical edge case.
            const NEEDS_DANIEL_NEGATION_RE = /\b(no|not|never|without|ingen|uten|aldri|ikke)\b/i;
            const NEEDS_DANIEL_CONJUNCTION_RE = /\b(but|however|although|though|yet|men|likevel)\b/gi;
            const NEEDS_DANIEL_PUNCT_TOKENS = ['--', '—', '–', '\n', '.', '!', '?', ',', ';', ':', '('];
            function needsDanielClauseStart(preceding) {
              let best = 0;
              for (const t of NEEDS_DANIEL_PUNCT_TOKENS) {
                const idx = preceding.lastIndexOf(t);
                if (idx !== -1) {
                  const end = idx + t.length;
                  if (end > best) best = end;
                }
              }
              NEEDS_DANIEL_CONJUNCTION_RE.lastIndex = 0;
              let cm;
              while ((cm = NEEDS_DANIEL_CONJUNCTION_RE.exec(preceding))) {
                const end = cm.index + cm[0].length;
                if (end > best) best = end;
              }
              return best;
            }
            function hasGenuineNeedsDanielFlag(text) {
              if (!text) return false;
              const re = /needs[_-]?daniel/gi;
              let m;
              while ((m = re.exec(text))) {
                const windowStart = Math.max(0, m.index - 80);
                const preceding = text.slice(windowStart, m.index);
                const clause = preceding.slice(needsDanielClauseStart(preceding));
                if (!NEEDS_DANIEL_NEGATION_RE.test(clause)) {
                  return true;
                }
              }
              return false;
            }
            if (hasGenuineNeedsDanielFlag(pr.body || '')) {
              await note('PR body carries a needs_daniel flag. Needs Daniel, no auto-approve.');
              core.info('needs_daniel in PR body — no-op');
              return;
            }
            if ((pr.labels || []).some(l => needsDanielRe.test(typeof l === 'string' ? l : (l && l.name) || ''))) {
              await note('PR carries a needs_daniel label. Needs Daniel, no auto-approve.');
              core.info('needs_daniel label — no-op');
              return;
            }

            // 2. Protected paths — never auto-approve if the diff touches these,
            //    regardless of any verdict comment. Self-protecting: this workflow
            //    file itself can never approve a PR that edits workflows.
            //
            //    Full intended surface (dev-request 2026-07-13-fleet-auto-approve-
            //    protected-path-regex-widen, Daniel-approved "A — utvid regex"):
            //    auth / session / cookie / admin-key / owner-portal / magic-link,
            //    plus the pre-existing infra guards below. /auth/i alone missed
            //    owner-portal.ts (#206, and again #287) because "owner-portal" has
            //    no "auth" substring — each of the patterns below is independent,
            //    not a rename of /auth/i.
            const PROTECTED = [
              /(^|\/)\.github\/workflows\//i,
              /(^|\/)fly\.toml$/i,
              /(^|\/)dockerfile$/i,
              /auth/i,
              /session/i,
              /cookie/i,
              /admin-key/i,
              /owner-portal/i,
              /magic-link/i,
              /(^|\/)\.env/i,
              /secret/i,
            ];
            // Content-based detection (dev-request 2026-08-16-fleet-auto-approve-
            // protected-innholdsbasert-deteksjon, Slice A). PROTECTED above only ever
            // matched f.filename — lokal#455/#499/#583 all touched real auth-mechanism
            // code in NEUTRALLY-NAMED files (crm.ts, analytics.ts, gardssalg-claim.ts)
            // and sailed straight through. Patterns are the actual identifiers this
            // repo uses for admin/session auth today (grepped, not guessed, 2026-08-16):
            // every admin route's own local `function requireAdmin[Auth](...)` gate,
            // the `ADMIN_KEY`/`ANALYTICS_ADMIN_KEY` env-var precedence it reads,
            // owner-session helpers (`sessionFromRequest`, `verifyOwnerSession`,
            // `readSessionCookie` — src/routes/gardssalg-claim.ts, owner-portal.ts),
            // `issueClaimMagicLink`, cookie-setting call sites, and any other
            // SECRET/KEY/TOKEN/PASS env var.
            //
            // Deliberately scoped to CHANGED (not merely touched) occurrences: a
            // pattern must match on an ADDED line **and** a REMOVED line of the same
            // file's patch to count — i.e. the diff EDITS existing matching code,
            // not just adds a brand-new admin route that follows the repo's own
            // standard `requireAdmin`/`ADMIN_KEY` boilerplate (every admin route
            // does that; flagging every one of them is exactly the "too broad, all
            // signal drowned in noise" failure AC4 exists to catch). Verified
            // empirically against the last 30 auto-merged lokal PRs before this
            // shipped: name-only gave 1 hit, unscoped content gave 12 (40% — too
            // broad), this add+remove-scoped version gives 2 (6.7%) while still
            // catching all three real incidents (#455/#499/#583 — each is a genuine
            // edit of a pre-existing ADMIN_KEY/ANALYTICS_ADMIN_KEY/sessionFromRequest
            // line, never a new file).
            const REQUIRE_ADMIN_RE = /\brequireAdmin\w*\b/;
            const PROTECTED_CONTENT = [
              /\bADMIN_KEY\b/,
              /\bANALYTICS_ADMIN_KEY\b/,
              REQUIRE_ADMIN_RE,
              /\bsessionFromRequest\b/,
              /\bverifyOwnerSession\b/,
              /\breadSessionCookie\b/,
              /\bissueClaimMagicLink\b/,
              /res\.cookie\(/,
              /res\.setHeader\(\s*['"]Set-Cookie['"]/i,
              /process\.env\.[A-Z_]*(SECRET|KEY|TOKEN|PASS)\b/,
            ];
            // patchLines(prefix) pulls the +/- content lines from a file's patch.
            // github.rest.pulls.listFiles's per-file `patch` field is hunks-only
            // (starts at the first `@@ ... @@` marker) — unlike a raw `git diff`,
            // it never carries `+++ b/file` / `--- a/file` headers, so there is no
            // doubled-prefix header line to filter out here. (An earlier version of
            // this helper excluded lines starting with the prefix doubled on the
            // false premise that such headers could appear — verified empirically
            // against real listFiles responses that they don't — which silently
            // dropped any added/removed line whose CONTENT itself started with a
            // literal `+`/`-` at column 0, e.g. unindented code or a markdown
            // bullet. Caught in review before merge, dev-request 2026-08-16-fleet-
            // auto-approve-protected-innholdsbasert-deteksjon.)
            const patchLines = (patch, prefix) =>
              (patch || '')
                .split('\n')
                .filter(l => l.startsWith(prefix))
                .join('\n');
            // requireAdminEditMatch(patch) — dev-request 2026-09-11-fleet-auto-approve-
            // requireadmin-falsk-positiv. Scoped to the requireAdmin pattern ONLY; every
            // other PROTECTED_CONTENT pattern still goes through the plain whole-pool
            // added&&removed test in contentEditMatch below, untouched (AC6).
            //
            // Root cause this fixes (lokal PR #626, #646): the whole-pool test flags a
            // file whenever *some* added line and *some* removed line anywhere in the
            // file's patch each merely CONTAIN "requireAdmin" — even when the one line
            // that actually changed left requireAdmin byte-identical and only touched
            // something else on that line (e.g. `(req` -> `async (req`), and the pool
            // only has a requireAdmin "removed" hit at all because of that same untouched
            // call. A file that separately adds a brand-new, ordinary requireAdmin-
            // guarded route (routine boilerplate — a pure ADDITION, no removed
            // counterpart) then makes the added/removed pools intersect on pure
            // coincidence, not because anything auth-relevant changed.
            //
            // Fix: parse the patch into "replace blocks" — a maximal run of removed (-)
            // lines immediately followed by a maximal run of added (+) lines (the
            // standard unified-diff "these lines were modified" shape). When a block's
            // removed-run and added-run have the SAME length, pair them positionally.
            // For each paired (removed, added) line that is NOT a requireAdmin
            // *definition* line on either side, if the sequence of requireAdmin-pattern
            // tokens matched on the removed line is IDENTICAL (same tokens, same order)
            // to the sequence matched on the added line, that pair's requireAdmin
            // occurrences are "explained" — the guard itself didn't change, something
            // else on the line did — and are masked out of the pool for this pattern
            // only before the final added/removed test. Anything NOT covered by such an
            // exempted pair (unpaired hunks, unequal-length replace blocks, pure
            // single-sided add/remove, or any definition-line edit) is left in the pool
            // exactly as before: fail-closed by construction, we only ever SUBTRACT
            // signal we can positively explain, never add leniency anywhere else (AC9).
            //
            // Definition lines are NEVER eligible for the exemption (AC1's "editing
            // requireAdmin's own implementation IS still flagged", suggested-approach
            // point 4): a line matching `function requireAdmin\w*(` on EITHER side of the
            // pair always counts as a genuine hit, even if the requireAdmin token
            // sequence on that line happens to be identical (e.g. only a parameter type
            // changed) — a token-sequence match alone can't tell "narrow signature tweak"
            // from "harmless", and this is a security-relevant surface, so it stays
            // unconditionally flagged rather than guessed at.
            //
            // Gap check (dev-request 2026-09-11-fleet-auto-approve-requireadmin-
            // falsk-positiv, reviewer-found gap, round 1): a same-requireAdmin-
            // token-sequence pair is NOT automatically collateral — a reviewer
            // showed `if (!requireAdmin(req, res)) return;` -> `if (isDevMode ||
            // !requireAdmin(req, res)) return;` has an identical token sequence
            // (["requireAdmin"] both sides) yet obviously must stay flagged: a
            // new `||`/`&&`/`!` conjoined directly onto the guard's own
            // invocation changes whether/when it gets evaluated. Token-sequence
            // equality alone can't distinguish that from the PR-646 case (an
            // unrelated `async` inserted elsewhere on the line), so
            // requireAdminChangeIsCollateral() below additionally locates the
            // single edited span on the line (longest common prefix/suffix between
            // the removed/added content) and requires every requireAdmin
            // occurrence to be structurally separated from that span — see the
            // bracket-depth mechanism documented directly above
            // requireAdminChangeIsCollateral() below (round 2 replaced round 1's
            // plain "boundary character anywhere in the gap" test, which had its
            // own gap — same dev-request, round-2 reviewer-found).
            // Mirrored (duplicated intentionally — this runner has no checkout step, so
            // this logic must stay inline) in
            // scripts/test-fleet-auto-approve-protected-paths.js — keep both in sync
            // (AC3/AC7).
            const REQUIRE_ADMIN_TOKEN_RE = /\brequireAdmin\w*\b/g;
            const REQUIRE_ADMIN_DEF_RE = /function\s+requireAdmin\w*\s*\(/;
            // String-literal-aware bracket depth: count of unmatched ( [ { in
            // s[0..i), NOT counting brackets that occur inside a quoted
            // string/template literal (handles simple backslash-escapes) — so a
            // route-path string containing a stray paren can't desync the count.
            const depthAt = (s, i) => {
              let d = 0;
              let quote = null;
              for (let j = 0; j < i; j++) {
                const c = s[j];
                if (quote) {
                  if (c === '\\') { j++; continue; }
                  if (c === quote) quote = null;
                  continue;
                }
                if (c === '"' || c === "'" || c === '`') { quote = c; continue; }
                if (c === '(' || c === '[' || c === '{') d++;
                else if (c === ')' || c === ']' || c === '}') d--;
              }
              return d;
            };
            // Is there a comma/semicolon strictly between [from,to) sitting AT
            // baseDepth — a sibling-argument or statement separator at the exact
            // nesting level shared by the token and the edited span — as opposed
            // to a closing bracket that merely happens to land back on baseDepth
            // (that's how a plain gap-substring boundary check misreads
            // requireAdmin's OWN closing paren as a safe stop for an edit
            // conjoined right after it, still inside the same if-condition: see
            // requireAdminChangeIsCollateral()'s comment below).
            const hasSameDepthSeparator = (s, from, to, baseDepth) => {
              let d = baseDepth;
              let quote = null;
              for (let j = from; j < to; j++) {
                const c = s[j];
                if (quote) {
                  if (c === '\\') { j++; continue; }
                  if (c === quote) quote = null;
                  continue;
                }
                if (c === '"' || c === "'" || c === '`') { quote = c; continue; }
                if (c === '(' || c === '[' || c === '{') { d++; continue; }
                if (c === ')' || c === ']' || c === '}') { d--; continue; }
                if (d === baseDepth && (c === ',' || c === ';')) return true;
              }
              return false;
            };
            // requireAdminChangeIsCollateral(rContent, aContent) — true only when
            // every requireAdmin occurrence in rContent is PROVABLY separated
            // from the line's single edited span (located via longest common
            // prefix/suffix between rContent and aContent — cheap and sufficient
            // since callers already confirmed the requireAdmin token sequence
            // itself matches). "Provably separated" means one of:
            //   (a) editDepth < occDepth — the edit sits at a strictly
            //       shallower/outer bracket-nesting level than the token's own
            //       immediate context, i.e. genuinely outside whatever group
            //       (call args, if-condition, …) scopes the token; or
            //   (b) editDepth === occDepth AND a comma/semicolon separator
            //       exists between token and edit AT that exact shared depth —
            //       the two are siblings (e.g. `router.post(path, requireAdmin,
            //       handler)`, PR-646's real shape), not connected within the
            //       same sub-expression.
            // editDepth > occDepth (edit nested inside/deeper than the token's
            // own call, e.g. its own argument list) is never collateral: fails
            // closed.
            //
            // This SUPERSEDES an earlier version of this fix that instead tested
            // for ANY boundary character `[,;{})]` occurring anywhere in the raw
            // gap substring between token and edit. That was gap-position-only,
            // not depth-aware, so a same-length replace-block pairing like
            // `if (!requireAdmin(req, res)) return;` -> `if (!requireAdmin(req,
            // res) && !bypassFlag) return;` slipped through: the gap substring
            // `(req, res)` (requireAdmin's own, UNEDITED argument list) trivially
            // contains `,` and `)`, even though the edit is a zero-width
            // insertion sitting immediately inside the still-open if-condition,
            // right between requireAdmin's own closing paren and the if's
            // closing paren — a genuine fail-open bypass, not collateral
            // (round-2 review gap; dev-request 2026-09-11-fleet-auto-approve-
            // requireadmin-falsk-positiv). Depth-aware separation closes this: at
            // the edit's position here, editDepth === 1 === occDepth (still
            // inside the if's own paren), and no comma/semicolon sits at that
            // depth between the token and the edit (the only comma is nested one
            // level deeper, inside requireAdmin's own now-closed arg list) — so
            // it correctly stays flagged.
            // Mirrored (duplicated intentionally — this runner has no checkout
            // step, so this logic must stay inline) in
            // scripts/test-fleet-auto-approve-protected-paths.js — keep both in
            // sync (AC3/AC7).
            const requireAdminChangeIsCollateral = (rContent, aContent) => {
              if (rContent === aContent) return true;
              const minLen = Math.min(rContent.length, aContent.length);
              let prefixLen = 0;
              while (prefixLen < minLen && rContent[prefixLen] === aContent[prefixLen]) prefixLen++;
              let suffixLen = 0;
              const maxSuffix = minLen - prefixLen;
              while (
                suffixLen < maxSuffix &&
                rContent[rContent.length - 1 - suffixLen] === aContent[aContent.length - 1 - suffixLen]
              ) suffixLen++;
              const changeStart = prefixLen;
              const changeEnd = rContent.length - suffixLen;
              const editDepth = depthAt(rContent, changeStart);
              REQUIRE_ADMIN_TOKEN_RE.lastIndex = 0;
              let m;
              while ((m = REQUIRE_ADMIN_TOKEN_RE.exec(rContent))) {
                const ts = m.index;
                const te = ts + m[0].length;
                if (te <= changeStart) {
                  const occDepth = depthAt(rContent, ts);
                  if (editDepth < occDepth) continue;
                  if (editDepth === occDepth && hasSameDepthSeparator(rContent, te, changeStart, occDepth)) continue;
                  return false;
                } else if (ts >= changeEnd) {
                  const occDepth = depthAt(rContent, ts);
                  if (editDepth < occDepth) continue;
                  if (editDepth === occDepth && hasSameDepthSeparator(rContent, changeEnd, ts, occDepth)) continue;
                  return false;
                } else {
                  return false; // occurrence overlaps the edited span itself
                }
              }
              return true;
            };
            const requireAdminEditMatch = (patch) => {
              const lines = (patch || '').split('\n');
              const maskRemoved = new Map();
              const maskAdded = new Map();
              let i = 0;
              while (i < lines.length) {
                if (lines[i].startsWith('-')) {
                  const removedIdx = [];
                  while (i < lines.length && lines[i].startsWith('-')) { removedIdx.push(i); i++; }
                  const addedIdx = [];
                  while (i < lines.length && lines[i].startsWith('+')) { addedIdx.push(i); i++; }
                  if (removedIdx.length === addedIdx.length) {
                    for (let k = 0; k < removedIdx.length; k++) {
                      const rContent = lines[removedIdx[k]].slice(1);
                      const aContent = lines[addedIdx[k]].slice(1);
                      if (REQUIRE_ADMIN_DEF_RE.test(rContent) || REQUIRE_ADMIN_DEF_RE.test(aContent)) continue;
                      const rMatches = rContent.match(REQUIRE_ADMIN_TOKEN_RE) || [];
                      const aMatches = aContent.match(REQUIRE_ADMIN_TOKEN_RE) || [];
                      const sameSeq = rMatches.length === aMatches.length && rMatches.every((m, idx2) => m === aMatches[idx2]);
                      if (rMatches.length > 0 && sameSeq && requireAdminChangeIsCollateral(rContent, aContent)) {
                        maskRemoved.set(removedIdx[k], rContent.replace(REQUIRE_ADMIN_TOKEN_RE, ''));
                        maskAdded.set(addedIdx[k], aContent.replace(REQUIRE_ADMIN_TOKEN_RE, ''));
                      }
                    }
                  }
                } else {
                  i++;
                }
              }
              const addedPool = lines
                .map((l, idx) => (l.startsWith('+') ? (maskAdded.has(idx) ? maskAdded.get(idx) : l.slice(1)) : null))
                .filter(x => x !== null)
                .join('\n');
              const removedPool = lines
                .map((l, idx) => (l.startsWith('-') ? (maskRemoved.has(idx) ? maskRemoved.get(idx) : l.slice(1)) : null))
                .filter(x => x !== null)
                .join('\n');
              return REQUIRE_ADMIN_RE.test(addedPool) && REQUIRE_ADMIN_RE.test(removedPool);
            };
            const contentEditMatch = (f) => {
              if (!f.patch) return null;
              const added = patchLines(f.patch, '+');
              const removed = patchLines(f.patch, '-');
              for (const re of PROTECTED_CONTENT) {
                if (re === REQUIRE_ADMIN_RE) {
                  if (requireAdminEditMatch(f.patch)) return re;
                  continue;
                }
                if (re.test(added) && re.test(removed)) return re;
              }
              return null;
            };
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            const touchedByName = files.filter(f => PROTECTED.some(re => re.test(f.filename)));
            const contentHits = files
              .map(f => ({ f, hit: contentEditMatch(f) }))
              .filter(x => x.hit);
            if (touchedByName.length > 0 || contentHits.length > 0) {
              const parts = [];
              if (touchedByName.length > 0) {
                parts.push(`filename: ${touchedByName.map(f => f.filename).join(', ')}`);
              }
              if (contentHits.length > 0) {
                parts.push(`content: ${contentHits.map(x => `${x.f.filename} (matched ${x.hit})`).join(', ')}`);
              }
              await note(`diff touches protected path(s) — ${parts.join(' | ')}. Needs Daniel, no auto-approve.`);
              core.info('protected path touched — no-op');
              return;
            }

            // 3. Size cap.
            //
            // Raised 1500 -> 3000 on Daniel's explicit instruction, 2026-07-30.
            //
            // What this widens: the fleet can now auto-merge a PR up to 3000
            // changed lines without Daniel reading it. The cap is not a quality
            // check — every other gate below still applies (independent
            // code-reviewer APPROVED, verdict doc on A2A main, all status checks
            // green, protected paths untouched). It is a blast-radius limit: the
            // bigger the diff, the more a reviewer can plausibly miss, and the
            // more a bad merge costs to unwind.
            //
            // Why it moved: lokal#410 (CRM steg 4) came in at 1596 lines and had
            // no path to merge at all. Branch protection requires an approving
            // review from an identity other than the author, and GitHub does not
            // let an author approve their own PR — so with the fleet gate refusing
            // on size, there was no eligible approver in the system. The cap was
            // not just inconvenient there; it was a deadlock.
            //
            // Note this file is itself a PROTECTED path (check 2 above), so a PR
            // that changes this number can never be auto-approved by the gate it
            // governs. That is deliberate and worth keeping: raising your own
            // approval limit is exactly the change that should need a human.
            const MAX_CHANGED_LINES = 3000;
            const changed = pr.additions + pr.deletions;
            if (changed > MAX_CHANGED_LINES) {
              await note(`diff is ${changed} changed lines (cap ${MAX_CHANGED_LINES}). Needs Daniel, no auto-approve.`);
              core.info('over size cap — no-op');
              return;
            }

            // 4. Review-verdict marker: a PR comment of the form
            //    REVIEW-VERDICT: APPROVED — <path under slookisen/A2A supervisor-inbox/>
            //    posted by the fleet identity itself AFTER an independent code-reviewer
            //    sub-agent returned APPROVED. Two independent defenses, since PR comments
            //    are attacker-writable by anyone with comment access on a public repo:
            //      a) the comment's AUTHOR must be a trusted fleet identity (`slookisen`
            //         or `claude[bot]`) — an outside commenter's "REVIEW-VERDICT" text is
            //         ignored outright. (claude[bot] added 2026-07-07, Option A: Cloud-
            //         Routine-posted comments resolve to the App identity, never the PAT's.)
            //      b) the referenced doc is never fetched from an attacker-supplied URL —
            //         only a bare relative path is accepted, and it is resolved ourselves
            //         against a fixed slookisen/A2A Contents-API call, so there is no SSRF
            //         surface and no way to point this workflow's secret at a third-party host.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const verdictRe = /^REVIEW-VERDICT:\s*APPROVED\s*—\s*(\S+)/m;
            const verdictComment = [...comments].reverse().find(
              c => c.user && FLEET_IDENTITIES.includes(c.user.login) && verdictRe.test(c.body || '')
            );
            if (!verdictComment) {
              core.info('no REVIEW-VERDICT: APPROVED comment from the trusted fleet account yet — waiting');
              return;
            }
            const rawRef = verdictComment.body.match(verdictRe)[1];
            // Only a bare "supervisor-inbox/<safe-filename>.md" path is accepted — reject
            // anything that looks like a URL, an absolute path, or a path-traversal attempt.
            const pathRe = /^supervisor-inbox\/[A-Za-z0-9_.-]+\.md$/;
            if (!pathRe.test(rawRef)) {
              await note(`REVIEW-VERDICT link "${rawRef}" is not a recognized supervisor-inbox/<file>.md path. No auto-approve.`);
              core.info('verdict link failed path allowlist — no-op');
              return;
            }

            if (!process.env.A2A_READ_PAT) {
              await note('REVIEW-VERDICT comment found but A2A_READ_PAT secret is not configured — cannot validate the linked review doc. No auto-approve until Daniel adds the secret (see dev-request).');
              core.info('A2A_READ_PAT missing — no-op');
              return;
            }
            let docText = '';
            try {
              const resp = await fetch(
                `https://api.github.com/repos/slookisen/A2A/contents/${rawRef}?ref=main`,
                {
                  headers: {
                    Authorization: `token ${process.env.A2A_READ_PAT}`,
                    Accept: 'application/vnd.github.raw+json',
                  },
                }
              );
              if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
              docText = await resp.text();
            } catch (e) {
              await note(`could not fetch review doc "${rawRef}": ${e.message}. No auto-approve.`);
              core.info('review doc fetch failed — no-op');
              return;
            }

            // needs_daniel, third and last place the fleet records it (Slice B,
            // same hard stop as step 1.5 above): the review-verdict doc itself —
            // this is exactly where #455's reviewer wrote "(needs_daniel,
            // protected-path)" and the old gate never read it.
            if (hasGenuineNeedsDanielFlag(docText)) {
              await note(`review doc "${rawRef}" carries a needs_daniel flag. Needs Daniel, no auto-approve.`);
              core.info('needs_daniel in review doc — no-op');
              return;
            }
            // Verdict anchoring — only the doc's own FIRST "VERDICT:"-marked line (its
            // top-of-file, final verdict, per every review doc's authoring convention — see
            // protocols/management-tier-charter.md §3.6) is authoritative. Any other
            // VERDICT:-shaped or APPROVED/REJECTED-shaped mention elsewhere in the body —
            // e.g. an honest "Review history" section narrating an earlier round's
            // CHANGES-REQUESTED before a later round returned APPROVED — must never be able
            // to flip this gate (dev-requests/2026-07-10-fleet-auto-approve-docrejected-
            // anchor-fix.md, lokal#208). A plain substring match on "APPROVED" would also
            // match "DISAPPROVED" / "NOT APPROVED"; require an explicit rejection check too
            // (lokal PR #161, 2026-07-08 — do not regress this).
            // Word-boundary anchored (`\b`), NOT line-start anchored (`^`): two verdict-doc
            // formats are both in active production use — a plain "VERDICT: APPROVED — ..."
            // first line, AND a markdown heading "# REVIEW-VERDICT: APPROVED — ..." whose
            // literal line does not START with "VERDICT:" but does contain it right after
            // the "-" in "REVIEW-VERDICT" (a non-word char, so `\b` still matches there).
            // An earlier draft used `^VERDICT:` and would have wrongly no-op'd on every
            // "# REVIEW-VERDICT:"-style doc (e.g. the one for lokal PR #216) — spot-checked
            // against real supervisor-inbox docs, don't reintroduce the `^` anchor.
            // No `/g` flag — `.match()` naturally returns the leftmost/first occurrence in
            // document order, which is what we want (the top-of-doc verdict always precedes
            // any later "Review history" mention in every real doc seen so far).
            // Mirrored (duplicated intentionally — this runner has no checkout step, so this
            // logic must stay inline) in scripts/test-fleet-auto-approve-verdict-anchor.js —
            // keep both in sync.
            const verdictLineMatch = docText.match(/\bVERDICT:\s*(\S.*)$/mi);
            if (!verdictLineMatch) {
              await note(`review doc "${rawRef}" has no "VERDICT:" marker. No auto-approve.`);
              core.info('review doc has no VERDICT: marker — no-op');
              return;
            }
            const verdictLine = verdictLineMatch[0];
            const isRejectedVerdict = /\bVERDICT:\s*(DISAPPROVED|NOT APPROVED|CHANGES-REQUESTED|REJECTED)\b/i.test(verdictLine);
            const isApprovedVerdict = !isRejectedVerdict && /\bVERDICT:\s*APPROVED\b/i.test(verdictLine);
            const windowStart = Math.max(0, verdictLineMatch.index - 200);
            const windowEnd = verdictLineMatch.index + verdictLine.length + 200;
            const prNearVerdict = new RegExp(`PR[- ]?#?${prNumber}\\b`, 'i').test(docText.slice(windowStart, windowEnd));
            const docApproved = isApprovedVerdict && prNearVerdict;
            const docRejected = isRejectedVerdict;
            if (docRejected || !docApproved) {
              await note(`review doc "${rawRef}" does not contain an explicit "VERDICT: APPROVED" (as the doc's first verdict marker) tied to PR #${prNumber}. No auto-approve.`);
              core.info('review doc does not confirm APPROVED — no-op');
              return;
            }

            // 5. Required status checks green for head SHA — both the legacy commit-status
            //    API and the newer check-runs API, since either can carry required checks.
            //
            //    Poll instead of exiting: the `check_suite: completed` trigger above never
            //    fires for a same-app (GITHUB_TOKEN-authored) check suite on this repo (0
            //    historical runs, confirmed empirically), so returning immediately while
            //    checks are still running leaves the PR stuck with nothing to re-evaluate
            //    it (dev-requests/2026-07-20-fleet-auto-approve-gate-race-checks-pending.md;
            //    PRs #304, #306, #345 all got stuck this way). Wait here up to ~10 minutes
            //    (15s intervals) and finish the approve+merge in this same run if checks
            //    land green within that budget.
            const POLL_INTERVAL_MS = 15000;
            const MAX_POLLS = 40; // 40 sleeps of 15s = ~10 minutes total (41st fetch is a no-sleep final check)
            // Self-check race: this very workflow's own check runs (the `resolve-pr`
            // and `evaluate` jobs of fleet-auto-approve.yml, whose check-run `name`
            // defaults to the job's display name since neither sets a custom `name:`)
            // are themselves part of checkRuns.check_runs for this head SHA. While
            // this `evaluate` job is mid-execution, its own check run's `status` is
            // necessarily `in_progress` — never `completed` — so without excluding
            // them, checksIncomplete would be permanently true for any PR whose only
            // non-completed check is fleet-auto-approve's own, and the gate could
            // never pass. Exclude them from both the incomplete and failed checks.
            // Keep this list in sync if either job is ever renamed.
            const OWN_JOB_NAMES = ['resolve-pr', 'evaluate'];
            let combined, checkRuns, statusesOk, externalCheckRuns, checksIncomplete;
            for (let poll = 0; poll <= MAX_POLLS; poll++) {
              ({ data: combined } = await github.rest.repos.getCombinedStatusForRef({
                owner, repo, ref: pr.head.sha,
              }));
              ({ data: checkRuns } = await github.rest.checks.listForRef({
                owner, repo, ref: pr.head.sha, per_page: 100,
              }));
              statusesOk = combined.state === 'success' || (combined.state === 'pending' && combined.statuses.length === 0);
              externalCheckRuns = checkRuns.check_runs.filter(r => !OWN_JOB_NAMES.includes(r.name));
              checksIncomplete = externalCheckRuns.some(r => r.status !== 'completed');
              if (!checksIncomplete || poll === MAX_POLLS) break;
              core.info(`checks still running — poll ${poll + 1}/${MAX_POLLS}, waiting ${POLL_INTERVAL_MS}ms`);
              await new Promise((r) => setTimeout(r, POLL_INTERVAL_MS));
            }
            const checksFailed = externalCheckRuns.some(r => r.status === 'completed' && !['success', 'skipped', 'neutral'].includes(r.conclusion));
            if (checksIncomplete) {
              // Unlike every other no-op branch below, this one has no future event to
              // rescue it (that's the whole reason we polled) — post a visible note so a
              // check that outlives the poll budget doesn't reproduce the original
              // invisible-stuck-PR symptom this fix exists to eliminate.
              await note('checks still running after the ~10-minute poll budget. No auto-approve yet — a future comment or push will re-evaluate.');
              core.info('checks still incomplete after full poll budget — giving up for this run; a future comment/push will re-evaluate');
              return;
            }
            if (checksFailed || !statusesOk) {
              await note('one or more status checks are red. No auto-approve.');
              core.info('checks red — no-op');
              return;
            }

            // All gates passed — approve as github-actions[bot] and enable auto-merge.
            await github.rest.pulls.createReview({
              owner, repo, pull_number: prNumber,
              event: 'APPROVE',
              body: `Auto-approved: independent fleet code-reviewer verdict confirmed at slookisen/A2A:${rawRef}, all status checks green, no protected-path or size-cap violation. Branch-protection required-approval satisfied by a distinct identity (github-actions[bot] != ${pr.user.login}).`,
            });

            // Merge + trigger deploy.
            //
            // dev-requests/2026-07-08-fleet-auto-approve-merge-does-not-trigger-deploy.md:
            // GitHub suppresses new workflow runs for events (push, pull_request, etc.)
            // generated by the default GITHUB_TOKEN, to prevent recursive triggering —
            // the ONE exception is workflow_dispatch/repository_dispatch. So a merge
            // performed by this job (which only ever has the default GITHUB_TOKEN, never
            // a PAT) into main will NOT fire fly-deploy.yml's `on: push` trigger, no
            // matter which of the two merge paths below is taken. We must dispatch
            // fly-deploy.yml explicitly once we know the merge commit exists.
            let mergedSha = null;

            try {
              // Our own checks above already confirmed the PR is green, so try a
              // direct synchronous merge first — this is the common case (matches
              // the pre-existing "clean status" fallback below, which shows this
              // is usually immediately mergeable once checks are green).
              const { data: mergeResult } = await github.rest.pulls.merge({
                owner, repo, pull_number: prNumber, merge_method: 'squash',
              });
              mergedSha = mergeResult.sha;
              core.info(`PR #${prNumber} merged directly — sha ${mergedSha}.`);
            } catch (directMergeErr) {
              // The client can see an error here even when the merge actually
              // succeeded server-side (e.g. a transient response hiccup) — check
              // before assuming failure, so we don't wrongly fall through to
              // enablePullRequestAutoMerge (which itself errors on an
              // already-merged PR) and skip the fly-deploy.yml dispatch below.
              try {
                const { data: maybeMerged } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                if (maybeMerged.merged) mergedSha = maybeMerged.merge_commit_sha;
              } catch (_) { /* fall through to the auto-merge path below */ }

              if (!mergedSha) {
                // GitHub hasn't caught up with the just-confirmed-green checks yet
                // (mergeable_state not 'clean' at this exact instant) — enable
                // auto-merge and let GitHub complete it, then poll briefly so we can
                // still dispatch fly-deploy.yml ourselves once it lands.
                try {
                  await github.graphql(`
                    mutation($prId: ID!) {
                      enablePullRequestAutoMerge(input: { pullRequestId: $prId, mergeMethod: SQUASH }) {
                        clientMutationId
                      }
                    }
                  `, { prId: pr.node_id });
                  for (let i = 0; i < 4 && !mergedSha; i++) {
                    await new Promise((r) => setTimeout(r, 3000));
                    const { data: freshPr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                    if (freshPr.merged) mergedSha = freshPr.merge_commit_sha;
                  }
                  if (!mergedSha) {
                    // No future event will rescue this: neither a direct merge
                    // nor GitHub's own async auto-merge completion fires a new
                    // push/check_suite run when performed under this job's
                    // GITHUB_TOKEN (that's the whole reason this dispatch step
                    // exists). If auto-merge lands after this poll window, this
                    // PR's deploy will NOT self-trigger — only the periodic
                    // platform-verifier's /health.git_sha staleness probe (or a
                    // human) will catch it. Say so plainly; do not claim a
                    // self-healing path that doesn't exist.
                    await note('approved; auto-merge enabled but not confirmed merged within ~12s. If/when it lands, fly-deploy.yml will NOT auto-dispatch for this PR (no push/check_suite event fires for a GITHUB_TOKEN-authored merge) — platform-verifier\'s periodic /health.git_sha probe should catch the staleness within its normal cycle, but for a faster fix trigger fly-deploy.yml manually from the Actions tab once /health confirms this merged.');
                  }
                } catch (autoMergeErr) {
                  await note(`approved, but could not merge or enable auto-merge (${autoMergeErr.message}) — merge manually.`);
                }
              }
            }

            if (mergedSha) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id: 'fly-deploy.yml', ref: 'main',
                });
                core.info(`Dispatched fly-deploy.yml for merge ${mergedSha}.`);
              } catch (dispatchErr) {
                await note(`merged (${mergedSha}) but could not dispatch fly-deploy.yml (${dispatchErr.message}) — trigger it manually from the Actions tab.`);
              }
            }

            core.info(`PR #${prNumber} auto-approve flow complete.`);

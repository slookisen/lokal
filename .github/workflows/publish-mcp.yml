name: Publish to MCP Registry

# Triggers:
#   1. workflow_dispatch — manual one-shot re-publish without bumping version (e.g. after description fix)
#   2. push to tags matching v* — auto-publish on every npm-style version tag (v0.4.1, v0.5.0, ...)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for OIDC authentication to MCP Registry
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
          chmod +x mcp-publisher

      # Servers published by this workflow: local dir <-> registry search name, in lockstep.
      # Add a dir to SERVER_DIRS and its search name at the same index in SERVER_NAMES
      # to onboard another server.json.
      - name: Validate all server.json manifests
        run: |
          set -e
          SERVER_DIRS=(mcp-server mcp-server-opplevagent mcp-server-dental)
          for dir in "${SERVER_DIRS[@]}"; do
            echo "== Validating $dir/server.json =="
            ./mcp-publisher validate "./$dir/server.json"
          done

      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish all servers to MCP Registry
        run: |
          set -e
          SERVER_DIRS=(mcp-server mcp-server-opplevagent mcp-server-dental)
          for dir in "${SERVER_DIRS[@]}"; do
            echo "== Publishing $dir/server.json =="
            set +e
            OUTPUT=$(./mcp-publisher publish "./$dir/server.json" 2>&1)
            STATUS=$?
            set -e
            echo "$OUTPUT"
            if [ "$STATUS" -ne 0 ]; then
              if echo "$OUTPUT" | grep -q "cannot publish duplicate version"; then
                echo "== $dir/server.json already published at this version, skipping =="
              else
                echo "== ERROR: publish failed for $dir/server.json (exit $STATUS) =="
                exit 1
              fi
            fi
          done

      - name: Verify publication (all servers)
        run: |
          set -e
          SERVER_DIRS=(mcp-server mcp-server-opplevagent mcp-server-dental)
          SERVER_NAMES=(io.github.slookisen/lokal-mcp io.github.slookisen/opplevagent-mcp io.github.slookisen/finn-tannlege-mcp)
          sleep 5
          for i in "${!SERVER_DIRS[@]}"; do
            dir="${SERVER_DIRS[$i]}"
            name="${SERVER_NAMES[$i]}"
            echo "== Verifying $name ($dir/server.json) =="
            curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=${name}" \
              | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          latest = next((s for s in data.get('servers', []) if s['_meta']['io.modelcontextprotocol.registry/official'].get('isLatest')), None)
          if latest:
              v = latest['server']['version']
              print(f'Latest in registry: v{v}')
              with open('${dir}/server.json') as f:
                  expected = json.load(f)['version']
              if v == expected:
                  print('✅ Registry matches local server.json version')
              else:
                  print(f'⚠️  Mismatch: registry={v}, expected={expected}')
                  sys.exit(1)
          else:
              print('❌ No isLatest entry found')
              sys.exit(1)
          "
          done

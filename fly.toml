# fly.toml app configuration file generated for lokal on 2026-03-31T15:10:58+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lokal'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  MEMORY_LIMIT_MB = '1024'
  # Daily outreach candidate cap (Grep 6, lokal#665 — resolveDailyPrepMaxCandidates()).
  # Non-secret feature flag, same convention as GARDSSALG_BOOKING_DISPATCH_ENABLED below.
  # Daniel raised 4 -> 6 (live sesjon 2026-08-21) now that Grep 7 releases ~23 candidates;
  # 10 is the code ceiling and the next step once second-touch opens ~8 Sept.
  DAILY_PREP_MAX_CANDIDATES = '6'
  # Gårdssalg booking dispatch master switch (dev-request 2026-07-14-booking-flyt-v1).
  # Non-secret feature flag → lives here rather than in Fly secrets. SAFE by the
  # double gate: a booking only dispatches when BOTH this is "true" AND the specific
  # provider's booking_live=1. Today only the hidden catalog_hidden=1 test provider
  # (created via POST /api/opplevelser/admin/gardssalg/test-provider) has booking_live=1,
  # so turning this on routes the notification solely to that test provider's email.
  # To pause again: set to 'false' (fail-safe: anything but the literal "true" = off).
  BOOKING_DISPATCH_ENABLED = 'true'
  # dev-request 2026-08-13-verifier-rutine-stub-og-kadens: turns on the
  # internal hourly lokal-agent-verifier scheduler in src/index.ts. The code
  # defaults OFF (gate is `=== "1"`, so this line — set to the exact string
  # '1' — is what actually turns it on). Setting it to any other value (e.g.
  # 'true') or removing the line entirely turns it back off, with no
  # redeploy-side-effects beyond that.
  VERIFIER_SCHEDULER_ENABLED = '1'
  # dev-request 2026-08-14-fetch-vegg-headless-fallback.md Slice 4: turns on
  # admin-rfb-website-discovery.ts's headless-render fallback for JS-built
  # producer sites. The route already exists and is already tested — it was
  # shipped flag-OFF because render-page.ts's renderer had no real backend
  # in production; this is what actually gives it one (render-page.ts now
  # calls the already-live render-worker via render-client.ts).
  RFB_WD_HEADLESS_FALLBACK_ENABLED = 'true'
  # dev-request 2026-08-14-fetch-vegg-headless-fallback.md Slice 4: same
  # switch as above, for marketplace.ts's processAgent() homepage-provenance
  # batch. Already shipped flag-OFF for the same reason.
  HOMEPAGE_PROVENANCE_HEADLESS_FALLBACK_ENABLED = 'true'
  # dev-request 2026-08-22-rfb-kildebredde-loft-pilot-forst.md item 5 (Fase 1):
  # turns on lokal-agent-verifier.ts's terminal-unconfirmable classification
  # (Brreg-slettet/konkurs, or zero identity sources on the second line) —
  # code already shipped flag-OFF in #687 (gate is `=== "true"`, so this line
  # is what actually turns it on). Moves those rows to a permanent
  # terminal_unconfirmable status and out of pickBatch's rotation instead of
  # cycling them through pending_verify forever. To pause again: set to
  # 'false' or remove the line — takes effect on next call, no restart
  # needed; already-terminal rows keep their stamp (see rollback text in the
  # dev-request).
  RFB_TERMINAL_UNCONFIRMABLE_ENABLED = 'true'

[[mounts]]
  source = 'lokal_data'
  destination = '/app/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "15s"
    method = "GET"
    path = "/.well-known/agent-card.json"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
  cpus = 1
  memory_mb = 1024

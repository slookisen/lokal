# fly.toml app configuration file generated for lokal on 2026-03-31T15:10:58+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lokal'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  MEMORY_LIMIT_MB = '1024'
  # Daily outreach candidate cap (Grep 6, lokal#665 — resolveDailyPrepMaxCandidates()).
  # Non-secret feature flag, same convention as GARDSSALG_BOOKING_DISPATCH_ENABLED below.
  # Daniel raised 4 -> 6 (live sesjon 2026-08-21) now that Grep 7 releases ~23 candidates;
  # 10 is the code ceiling and the next step once second-touch opens ~8 Sept.
  DAILY_PREP_MAX_CANDIDATES = '6'
  # Gårdssalg booking dispatch master switch (dev-request 2026-07-14-booking-flyt-v1).
  # Non-secret feature flag → lives here rather than in Fly secrets. SAFE by the
  # double gate: a booking only dispatches when BOTH this is "true" AND the specific
  # provider's booking_live=1. Today only the hidden catalog_hidden=1 test provider
  # (created via POST /api/opplevelser/admin/gardssalg/test-provider) has booking_live=1,
  # so turning this on routes the notification solely to that test provider's email.
  # To pause again: set to 'false' (fail-safe: anything but the literal "true" = off).
  BOOKING_DISPATCH_ENABLED = 'true'
  # dev-request 2026-08-13-verifier-rutine-stub-og-kadens: turns on the
  # internal hourly lokal-agent-verifier scheduler in src/index.ts. The code
  # defaults OFF (gate is `=== "1"`, so this line — set to the exact string
  # '1' — is what actually turns it on). Setting it to any other value (e.g.
  # 'true') or removing the line entirely turns it back off, with no
  # redeploy-side-effects beyond that.
  VERIFIER_SCHEDULER_ENABLED = '1'
  # dev-request 2026-08-14-fetch-vegg-headless-fallback.md Slice 4: turns on
  # admin-rfb-website-discovery.ts's headless-render fallback for JS-built
  # producer sites. The route already exists and is already tested — it was
  # shipped flag-OFF because render-page.ts's renderer had no real backend
  # in production; this is what actually gives it one (render-page.ts now
  # calls the already-live render-worker via render-client.ts).
  RFB_WD_HEADLESS_FALLBACK_ENABLED = 'true'
  # dev-request 2026-08-14-fetch-vegg-headless-fallback.md Slice 4: same
  # switch as above, for marketplace.ts's processAgent() homepage-provenance
  # batch. Already shipped flag-OFF for the same reason.
  HOMEPAGE_PROVENANCE_HEADLESS_FALLBACK_ENABLED = 'true'
  # dev-request 2026-08-22-rfb-kildebredde-loft-pilot-forst.md, Fase 1 item 3
  # (Daniel-autorisert 2026-08-23, daniel-responses/2026-08-23-go-tre-beslutninger-og-
  # effektmaal.md, beslutning C): slar PA andrelinje-verifisering + paraply-ruting
  # (PR #684, allerede kodet+testet+deployet flagg-AV) for resten av pending_verify-
  # koen (~880). Ingen ny kode her - kun flagget. Rollback: sett til 'false' eller
  # fjern linjen; profiler allerede satt `verified_second_line=1` beholder stempelet
  # (permanent provenance, uendret ved flagg-av) men INGEN NYE skrives mens AV.
  RFB_SECOND_LINE_VERIFICATION_ENABLED = 'true'
  # dev-request 2026-08-22-rfb-kildebredde-loft-pilot-forst.md item 5 (Fase 1):
  # turns on lokal-agent-verifier.ts's terminal-unconfirmable classification
  # (Brreg-slettet/konkurs, or zero identity sources on the second line) —
  # code already shipped flag-OFF in #687 (gate is `=== "true"`, so this line
  # is what actually turns it on). Moves those rows to a permanent
  # terminal_unconfirmable status and out of pickBatch's rotation instead of
  # cycling them through pending_verify forever. To pause again: set to
  # 'false' or remove the line — takes effect on next call, no restart
  # needed; already-terminal rows keep their stamp (see rollback text in the
  # dev-request). NB (2026-08-24, PR #694 review): the brreg_konkurs/inactive
  # branch this flag also gates is currently dead code in production — no
  # real caller wires a brregLookup into runVerifierBatch — so this flag's
  # only live effect today is the zero-identity-sources branch, and only
  # once RFB_SECOND_LINE_VERIFICATION_ENABLED above is also 'true'. See
  # dev-request FUNN block for the brregLookup gap.
  RFB_TERMINAL_UNCONFIRMABLE_ENABLED = 'true'
  # dev-request 2026-08-28-gardssalg-kildebredde-wiring.md Grep 2 (PR #738,
  # shipped flag-OFF as specified): enables POST /admin/gardssalg-second-line-verify
  # (on-demand, max 48 ids per call, judge-API-gated, stamps
  # field_provenance.second_line_verification) and the verified_second_line
  # mirror in gardssalg-outreach-readiness. Daniel GO'd the flip in live
  # session 2026-08-29 (A2A daniel-responses/2026-08-29-go-second-line-flipp-
  # og-remapping-dev-request.md). Deliberately NOT wired into any cron/sweep —
  # flipping this starts no background volume; it only un-no-ops the endpoint.
  # Gate is `=== "true"`, read fresh per call; fail-safe: anything else = off,
  # byte-identical to pre-#738 behavior. Existing stamps survive a flip-off
  # (permanent provenance) but no new ones are written while off.
  GS_SECOND_LINE_VERIFICATION_ENABLED = 'true'
  # dev-request 2026-08-29-gs-second-line-kildeklasse-bredde.md Del C (PR #740,
  # shipped flag-OFF as specified): enables POST
  # /admin/gardssalg-kildeklasse-contact-intake (on-demand 1881/bransjeliste
  # kildeklasse contact-candidate intake). Daniel's drive-order covers the
  # flip (A2A daniel-responses/2026-08-29-storkonsern-50-og-drive-til-
  # outreach.md). Deliberately NOT wired into any cron/sweep — flipping this
  # starts no background volume; it only un-no-ops the endpoint. Gate is
  # `=== "true"`, read fresh per call; fail-safe: anything else = off,
  # byte-identical to pre-#740 behavior.
  GS_KILDEKLASSE_CONTACT_ENABLED = 'true'
  # dev-request 2026-09-02-flerspraklige-profiler-rfb-og-opplevagent — Daniel GO #1
  # (live 2026-09-02 ~21:15Z, A2A daniel-responses/2026-09-02-go-1-oversettelse-
  # intensiv-12t.md): the EN/SV profile-translation belt. Four independent
  # switches; gate is `=== "true"`, read fresh per call; fail-safe: anything
  # else = off. Writes ONLY to the profile_translations table (own rows,
  # draft→reviewed→verified), NEVER to Norwegian source columns, and NEVER
  # publishes — PROFILE_TRANSLATIONS_SERVE_ENABLED stays OFF here, so nothing
  # is visible to visitors until Daniel GO #3 (publish + serve flip).
  #   PROFILE_TRANSLATIONS_ENABLED        — LLM switch for the pipeline.
  #   PROFILE_TRANSLATIONS_WORKER_ENABLED — in-process worker (src/services/
  #     profile-translations-worker.ts): intensive (5 parallel belts, back-to-
  #     back) until INTENSIVE_UNTIL, then STEADY_ITEMS_PER_HOUR per rolling hour
  #     («kraftig i 12 timer, deretter mindre puljer pga usage»).
  # Kill switches: PROFILE_TRANSLATIONS_ENABLED='false' stops all LLM spend on
  # the next tick; WORKER_ENABLED='false' + deploy stops the interval.
  # 2026-09-03 Daniel: no Anthropic API spend for translations — the Claude Code
  # session / Cloud Routine session translates via GET /collect + POST /submit.
  # Both LLM switches OFF; the store, verifier, publish gate and flags below stay.
  PROFILE_TRANSLATIONS_ENABLED = 'false'
  PROFILE_TRANSLATIONS_WORKER_ENABLED = 'false'
  PROFILE_TRANSLATIONS_WORKER_INTENSIVE_UNTIL = '2026-09-03T09:30:00Z'
  PROFILE_TRANSLATIONS_WORKER_INTENSIVE_CONCURRENCY = '5'
  PROFILE_TRANSLATIONS_WORKER_STEADY_ITEMS_PER_HOUR = '20'
  # Daniel 2026-09-02 («engelsk er prio»): all English items on both platforms
  # before any Swedish one. Fail-safe: unknown/empty = en,sv.
  PROFILE_TRANSLATIONS_WORKER_LANG_PRIORITY = 'en,sv'
  # Daniel 2026-09-03 «merget, sett på flaggene nå»: English profile texts are
  # served on /en (2 496 verified fields), and the language a visitor picks
  # follows them across pages (session cookie, URL still wins — see
  # src/i18n/middleware.ts). Norwegian stays the default everywhere.
  PROFILE_TRANSLATIONS_SERVE_ENABLED = 'true'
  LANG_COOKIE_REDIRECT_ENABLED = 'true'
  OPPLEVAGENT_LANG_SWITCHER_ENABLED = 'false'
  SV_LOCALE_ENABLED = 'false'

[[mounts]]
  source = 'lokal_data'
  destination = '/app/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "15s"
    method = "GET"
    path = "/.well-known/agent-card.json"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
  cpus = 1
  memory_mb = 1024
